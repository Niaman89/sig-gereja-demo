<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d32">
<title>Sistem Informasi Gereja — Prototipe</title>
<style>
:root{--green:#173d32;--green2:#24624d;--mint:#eaf3ee;--bg:#f4f7f5;--ink:#1c2923;--muted:#66756d;--line:#dce5df;--white:#fff;--gold:#c9a45b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--green);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{width:43px;height:43px;border-radius:12px;background:#ffffff1c;display:grid;place-items:center;font-size:24px}.brand strong{display:block;font-size:16px}.brand small{color:#c9dbd1}.nav{display:grid;gap:5px}.nav button{background:transparent;border:0;color:#d9e8df;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff1b;color:#fff}.nav .ico{width:22px;text-align:center}.sidefoot{margin-top:auto;color:#c9dbd1;font-size:12px;padding:8px}
main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:17px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:2}.top h1{font-size:21px;margin:0}.top p{margin:3px 0 0;color:var(--muted);font-size:13px}.status{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;white-space:nowrap}.dot{width:8px;height:8px;background:#399d69;border-radius:50%}.content{padding:26px 28px;max-width:1450px;margin:auto}.welcome{background:linear-gradient(120deg,#173d32,#2f7456);color:white;padding:24px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.welcome h2{margin:0 0 6px;font-size:24px}.welcome p{margin:0;color:#d7e9df}.welcome .emblem{font-size:44px;opacity:.9}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{background:var(--mint);border-radius:10px;width:37px;height:37px;display:grid;place-items:center;font-size:19px}.stat strong{display:block;font-size:28px;margin:12px 0 2px}.stat small{color:var(--muted)}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel h3{margin:0 0 14px;font-size:16px}.activity{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ee}.activity:last-child{border:0}.activity .bubble{width:36px;height:36px;flex:none;border-radius:10px;background:var(--mint);display:grid;place-items:center}.activity p{margin:0}.activity small{color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;text-align:left;color:var(--ink)}.quick button:hover{border-color:var(--green2);background:#f8fbf9}.quick b{display:block;margin-top:7px}.quick span{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input,.toolbar select,.field input,.field select{border:1px solid #ccd8d0;border-radius:9px;padding:10px 12px;background:white;min-width:0}.toolbar input{flex:1;min-width:180px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 13px;border-radius:9px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn:hover{filter:brightness(.97)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid #edf1ee;white-space:nowrap}th{background:#f8faf8;color:#53645a;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}.pill{display:inline-block;background:var(--mint);color:#24624d;border-radius:99px;padding:4px 8px;font-size:12px}.empty{padding:32px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}.field input,.field select{width:100%}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{background:#fff7e5;border:1px solid #f0dfb5;border-radius:12px;padding:13px 15px;color:#765a20;font-size:13px;margin-bottom:16px}.devotion{background:#f6faf7;border-left:4px solid var(--green2);padding:18px;border-radius:0 12px 12px 0}.devotion blockquote{font-size:18px;font-weight:600;margin:10px 0}.muted{color:var(--muted)}.hidden{display:none!important}.mobilemenu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.side.open{display:flex;position:fixed;inset:0 auto 0 0;width:260px;z-index:5;box-shadow:0 0 0 100vmax #0006}.mobilemenu{display:inline-block}.top{padding:14px 17px}.content{padding:18px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.welcome h2{font-size:20px}.welcome .emblem{display:none}}
@media(max-width:500px){.grid{gap:9px}.stat,.panel{padding:13px}.stat strong{font-size:23px}.formgrid{grid-template-columns:1fr}.top h1{font-size:18px}.status{font-size:0}.status .dot{font-size:12px}.welcome{padding:19px}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="sidebar">
  <div class="brand"><div class="logo">⛪</div><div><strong>Sistem Informasi Gereja</strong><small>Manajemen Pelayanan</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="anggota"><span class="ico">♙</span>Data Anggota</button>
    <button data-page="keuangan"><span class="ico">▤</span>Keuangan</button>
    <button data-page="pelayanan"><span class="ico">▣</span>Jadwal Pelayanan</button>
    <button data-page="renungan"><span class="ico">✧</span>Renungan Harian</button>
    <button data-page="laporan"><span class="ico">▥</span>Laporan & Ekspor</button>
    <button data-page="pengaturan"><span class="ico">⚙</span>Organisasi & Pengguna</button>
  </nav>
  <div class="sidefoot">Prototipe lokal • Data contoh<br>Belum terhubung ke server gereja</div>
</aside>
<main>
<header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="menuBtn" aria-label="Buka menu">☰</button><div><h1 id="pageTitle">Dashboard</h1><p id="crumb">Ringkasan informasi jemaat</p></div></div><div class="status"><span class="dot"></span><span id="connection">Mode lokal • siap digunakan</span></div></header>
<div class="content" id="view"></div>
</main>
</div>
<script>
const initialMembers=[
{id:'JMT-0001',name:'Markus Zega',family:'Keluarga Zega',resort:'Resort 01',church:'Jemaat Contoh',phone:'0812-0000-0001',status:'Aktif'},
{id:'JMT-0002',name:'Maria Ziliwu',family:'Keluarga Ziliwu',resort:'Resort 01',church:'Jemaat Contoh',phone:'0812-0000-0002',status:'Aktif'},
{id:'JMT-0003',name:'Yohanes Telaumbanua',family:'Keluarga Telaumbanua',resort:'Resort 02',church:'Jemaat Contoh 2',phone:'0812-0000-0003',status:'Aktif'},
{id:'JMT-0004',name:'Debora Harefa',family:'Keluarga Harefa',resort:'Resort 02',church:'Jemaat Contoh 2',phone:'0812-0000-0004',status:'Perpindahan'}
];
const initialTransactions=[
{id:'TRX-001',date:'2026-10-02',type:'Pemasukan',category:'Persembahan umum',amount:1250000,church:'Jemaat Contoh',note:'Ibadah Minggu'},
{id:'TRX-002',date:'2026-10-05',type:'Pengeluaran',category:'Operasional',amount:450000,church:'Jemaat Contoh',note:'Kebutuhan gereja'},
{id:'TRX-003',date:'2026-10-11',type:'Pemasukan',category:'Persembahan syukur',amount:800000,church:'Jemaat Contoh',note:'Persembahan khusus'},
];
const initialEvents=[
{date:'2026-10-25',title:'Ibadah Minggu',place:'Gedung Gereja',person:'Pendeta / pelayan firman'},
{date:'2026-10-28',title:'Persekutuan Doa',place:'Gedung Gereja',person:'Tim doa'},
{date:'2026-11-01',title:'Ibadah Minggu dan Perjamuan Kudus',place:'Gedung Gereja',person:'Majelis jemaat'}
];
let members=load('sim_members',initialMembers),transactions=load('sim_transactions',initialTransactions),events=load('sim_events',initialEvents);
let page='dashboard';
function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch(e){return fallback}}
function save(){localStorage.setItem('sim_members',JSON.stringify(members));localStorage.setItem('sim_transactions',JSON.stringify(transactions));localStorage.setItem('sim_events',JSON.stringify(events))}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
window.addEventListener('online',()=>document.getElementById('connection').textContent='Online • prototipe tetap menyimpan data lokal');
window.addEventListener('offline',()=>document.getElementById('connection').textContent='Offline • data disimpan di perangkat');
function stat(label,val,icon,sub){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${val}</strong><small>${sub}</small></div>`}
function dashboard(){let income=transactions.filter(t=>t.type==='Pemasukan').reduce((a,t)=>a+t.amount,0),out=transactions.filter(t=>t.type==='Pengeluaran').reduce((a,t)=>a+t.amount,0);
return `<section class="welcome"><div><h2>Selamat datang di Sistem Informasi Gereja</h2><p>Pusat data, administrasi, dan pelayanan gereja dalam satu sistem.</p><p style="font-size:12px;margin-top:12px">Wilayah contoh: Jemaat Lokal</p></div><div class="emblem">⛪</div></section>
<div class="grid">${stat('Anggota terdaftar',members.length,'♙','Data contoh pada perangkat')}${stat('Transaksi tercatat',transactions.length,'▤','Pemasukan dan pengeluaran')}${stat('Jadwal mendatang',events.length,'▣','Agenda contoh')}${stat('Saldo transaksi',money(income-out),'↗','Berdasarkan data contoh')}</div>
<div class="two"><section class="panel"><h3>Aktivitas terbaru</h3><div class="activity"><div class="bubble">♙</div><div><p><b>Data anggota</b> siap dikelola</p><small>${members.length} anggota dalam data contoh</small></div></div><div class="activity"><div class="bubble">▤</div><div><p><b>Keuangan jemaat</b></p><small>${transactions.length} transaksi tercatat di perangkat ini</small></div></div><div class="activity"><div class="bubble">▣</div><div><p><b>Agenda pelayanan</b></p><small>${events.length} agenda contoh tersedia</small></div></div><div class="activity"><div class="bubble">⇩</div><div><p><b>Mode penyimpanan lokal</b></p><small>Data demo disimpan pada browser ini</small></div></div></section>
<section class="panel"><h3>Akses cepat</h3><div class="quick"><button onclick="setPage('anggota')">♙<b>Tambah anggota</b><span>Daftarkan anggota baru</span></button><button onclick="setPage('keuangan')">＋<b>Catat transaksi</b><span>Pemasukan / pengeluaran</span></button><button onclick="setPage('pelayanan')">▣<b>Jadwal pelayanan</b><span>Kelola agenda</span></button><button onclick="setPage('laporan')">⇩<b>Ekspor laporan</b><span>Unduh CSV untuk Excel</span></button></div></section></div>
<div class="notice" style="margin-top:16px">Penting: seluruh nama dan transaksi yang ditampilkan merupakan data ilustrasi, bukan data resmi gereja.</div>`}
function membersPage(){return `<div class="toolbar"><input id="memberSearch" placeholder="Cari nama, nomor anggota, keluarga, jemaat..." oninput="filterMembers()"><button class="btn" onclick="exportMembers()">⇩ Ekspor Excel/CSV</button><button class="btn primary" onclick="showMemberForm()">＋ Tambah anggota</button></div><div class="tablewrap"><table><thead><tr><th>No. anggota</th><th>Nama</th><th>Keluarga</th><th>Resort</th><th>Jemaat</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="memberRows">${memberRows(members)}</tbody></table></div><p class="muted" style="font-size:12px;margin-top:10px">Klik “Tambah anggota” untuk mencoba formulir. Data tersimpan di browser ini.</p><div id="memberFormHolder"></div>`}
function memberRows(list){if(!list.length)return '<tr><td colspan="7" class="empty">Tidak ada anggota yang cocok.</td></tr>';return list.map(m=>`<tr><td>${esc(m.id)}</td><td><b>${esc(m.name)}</b><br><small class="muted">${esc(m.phone||'')}</small></td><td>${esc(m.family)}</td><td>${esc(m.resort)}</td><td>${esc(m.church)}</td><td><span class="pill">${esc(m.status)}</span></td><td><button class="btn" onclick="deleteMember('${esc(m.id)}')">Hapus</button></td></tr>`).join('')}
function filterMembers(){let q=document.getElementById('memberSearch').value.toLowerCase();document.getElementById('memberRows').innerHTML=memberRows(members.filter(m=>Object.values(m).join(' ').toLowerCase().includes(q)))}
function showMemberForm(){document.getElementById('memberFormHolder').innerHTML=`<section class="panel" style="margin-top:16px"><h3>Tambah anggota baru</h3><form id="memberForm"><div class="formgrid"><div class="field"><label>Nama lengkap *</label><input name="name" required></div><div class="field"><label>Nomor anggota</label><input name="id" placeholder="Otomatis jika kosong"></div><div class="field"><label>Nama keluarga</label><input name="family" required></div><div class="field"><label>Nomor telepon</label><input name="phone"></div><div class="field"><label>Resort</label><input name="resort" value="Resort 01" required></div><div class="field"><label>Jemaat</label><input name="church" value="Jemaat Contoh" required></div><div class="field"><label>Status</label><select name="status"><option>Aktif</option><option>Nonaktif</option><option>Perpindahan</option></select></div></div><div class="form-actions"><button type="button" class="btn" onclick="document.getElementById('memberFormHolder').innerHTML=''">Batal</button><button class="btn primary">Simpan anggota</button></div></form></section>`;document.getElementById('memberForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id=d.id||'JMT-'+String(Date.now()).slice(-6);members.push(d);save();render();}}
function deleteMember(id){if(confirm('Hapus anggota '+id+' dari data demo?')){members=members.filter(m=>m.id!==id);save();render()}}
function financePage(){let income=transactions.filter(t=>t.type==='Pemasukan').reduce((a,t)=>a+t.amount,0),out=transactions.filter(t=>t.type==='Pengeluaran').reduce((a,t)=>a+t.amount,0);return `<div class="grid">${stat('Total pemasukan',money(income),'↙','Data contoh')}${stat('Total pengeluaran',money(out),'↗','Data contoh')}${stat('Saldo bersih',money(income-out),'＝','Pemasukan dikurangi pengeluaran')}${stat('Jumlah transaksi',transactions.length,'▤','Semua transaksi lokal')}</div><div class="toolbar"><input id="txSearch" placeholder="Cari kategori, catatan, tanggal..." oninput="filterTransactions()"><button class="btn" onclick="exportTransactions()">⇩ Ekspor Excel/CSV</button><button class="btn primary" onclick="showTxForm()">＋ Catat transaksi</button></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Catatan</th><th>Jemaat</th><th>Jumlah</th></tr></thead><tbody id="txRows">${txRows(transactions)}</tbody></table></div><div id="txFormHolder"></div><div class="notice" style="margin-top:15px">Prototipe ini belum menggantikan pembukuan resmi. Versi produksi memerlukan validasi, penomoran bukti transaksi, audit, dan persetujuan sesuai tata gereja.</div>`}
function txRows(list){if(!list.length)return '<tr><td colspan="6" class="empty">Belum ada transaksi.</td></tr>';return list.map(t=>`<tr><td>${esc(t.date)}</td><td><span class="pill">${esc(t.type)}</span></td><td>${esc(t.category)}</td><td>${esc(t.note)}</td><td>${esc(t.church)}</td><td><b>${money(t.amount)}</b></td></tr>`).join('')}
function filterTransactions(){let q=document.getElementById('txSearch').value.toLowerCase();document.getElementById('txRows').innerHTML=txRows(transactions.filter(t=>Object.values(t).join(' ').toLowerCase().includes(q)))}
function showTxForm(){document.getElementById('txFormHolder').innerHTML=`<section class="panel" style="margin-top:16px"><h3>Catat transaksi</h3><form id="txForm"><div class="formgrid"><div class="field"><label>Tanggal *</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Jenis *</label><select name="type"><option>Pemasukan</option><option>Pengeluaran</option></select></div><div class="field"><label>Kategori *</label><input name="category" required placeholder="Misalnya persembahan umum"></div><div class="field"><label>Jumlah rupiah *</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Jemaat</label><input name="church" value="Jemaat Contoh" required></div><div class="field"><label>Catatan</label><input name="note"></div></div><div class="form-actions"><button type="button" class="btn" onclick="document.getElementById('txFormHolder').innerHTML=''">Batal</button><button class="btn primary">Simpan transaksi</button></div></form></section>`;document.getElementById('txForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.id='TRX-'+String(Date.now()).slice(-6);d.amount=Number(d.amount);transactions.push(d);save();render()}}
function servicePage(){return `<div class="toolbar"><button class="btn primary" onclick="showEventForm()">＋ Tambah agenda</button><button class="btn" onclick="exportEvents()">⇩ Ekspor agenda</button></div><div class="panel"><h3>Kalender dan jadwal pelayanan</h3>${events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="activity"><div class="bubble">▣</div><div style="flex:1"><p><b>${esc(e.title)}</b></p><small>${esc(e.date)} · ${esc(e.place)} · Petugas: ${esc(e.person)}</small></div></div>`).join('')||'<p class="muted">Belum ada agenda.</p>'}</div><div id="eventHolder"></div>`}
function showEventForm(){document.getElementById('eventHolder').innerHTML=`<section class="panel" style="margin-top:16px"><h3>Tambah agenda pelayanan</h3><form id="eventForm"><div class="formgrid"><div class="field"><label>Tanggal</label><input type="date" name="date" required></div><div class="field"><label>Nama kegiatan</label><input name="title" required></div><div class="field"><label>Lokasi</label><input name="place" required></div><div class="field"><label>Petugas / penanggung jawab</label><input name="person" required></div></div><div class="form-actions"><button type="button" class="btn" onclick="document.getElementById('eventHolder').innerHTML=''">Batal</button><button class="btn primary">Simpan agenda</button></div></form></section>`;document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();events.push(Object.fromEntries(new FormData(e.target)));save();render()}}
function devotionPage(){return `<section class="panel"><h3>Renungan harian</h3><div class="devotion"><small class="muted">RENUNGAN CONTOH · Mazmur 118:24</small><blockquote>“Inilah hari yang dijadikan TUHAN, marilah kita bersorak-sorak dan bersukacita karenanya!”</blockquote><p><b>Tema: Menjalani hari bersama Tuhan</b></p><p>Setiap hari merupakan kesempatan untuk menerima pemeliharaan Tuhan dan melayani sesama. Sukacita iman tidak selalu berarti semua keadaan mudah, tetapi kita belajar menjalani hari dengan pengharapan, kesetiaan, dan kasih.</p><p><b>Doa:</b> Tuhan, tuntunlah langkah kami hari ini agar pekerjaan, keluarga, dan pelayanan kami memuliakan nama-Mu. Amin.</p></div><p class="muted" style="font-size:12px;margin-top:14px">Konten ini contoh awal. Modul pengelolaan renungan oleh editor sinode akan ditambahkan pada versi berikutnya.</p></section>`}
function reportsPage(){return `<section class="panel"><h3>Laporan dan ekspor data</h3><p class="muted">Pilih data yang ingin diekspor. File CSV dapat dibuka di Microsoft Excel atau aplikasi spreadsheet lain.</p><div class="quick"><button onclick="exportMembers()">⇩<b>Daftar anggota</b><span>${members.length} baris data</span></button><button onclick="exportTransactions()">⇩<b>Laporan transaksi</b><span>${transactions.length} baris data</span></button><button onclick="exportEvents()">⇩<b>Jadwal pelayanan</b><span>${events.length} agenda</span></button><button onclick="exportAll()">⇩<b>Ekspor semua data</b><span>Unduh berkas JSON cadangan demo</span></button></div></section><section class="panel" style="margin-top:16px"><h3>Ringkasan data</h3><div class="tablewrap"><table><thead><tr><th>Jenis</th><th>Jumlah</th><th>Keterangan</th></tr></thead><tbody><tr><td>Anggota</td><td>${members.length}</td><td>Data anggota lokal</td></tr><tr><td>Transaksi</td><td>${transactions.length}</td><td>Data keuangan contoh</td></tr><tr><td>Agenda</td><td>${events.length}</td><td>Jadwal pelayanan contoh</td></tr></tbody></table></div></section>`}
function settingsPage(){return `<div class="notice">Pengaturan ini hanya menjelaskan struktur organisasi yang akan dipakai. Login dan pengaturan peran belum aktif pada prototipe.</div><section class="panel"><h3>Struktur organisasi</h3><div class="activity"><div class="bubble">⌂</div><div><b>Sinode BNKP</b><br><small class="muted">Tingkat pusat · akses lintas resort sesuai kewenangan</small></div></div><div class="activity"><div class="bubble">⌂</div><div><b>Resort</b><br><small class="muted">Mengelola dan memantau jemaat di wilayah resort</small></div></div><div class="activity"><div class="bubble">⛪</div><div><b>Jemaat</b><br><small class="muted">Mengelola anggota, kegiatan, dan transaksi jemaat</small></div></div></section><section class="panel" style="margin-top:16px"><h3>Peran yang direncanakan</h3><div class="tablewrap"><table><thead><tr><th>Peran</th><th>Wilayah akses</th><th>Hak utama</th></tr></thead><tbody><tr><td>Admin Sinode</td><td>Sinode</td><td>Konfigurasi, pengguna, laporan konsolidasi</td></tr><tr><td>Pengurus Resort</td><td>Resort yang ditugaskan</td><td>Pemantauan dan laporan wilayah</td></tr><tr><td>Pendeta / Majelis</td><td>Jemaat yang ditugaskan</td><td>Data anggota dan pelayanan sesuai izin</td></tr><tr><td>Sekretariat</td><td>Jemaat yang ditugaskan</td><td>Administrasi dan keanggotaan</td></tr><tr><td>Bendahara</td><td>Jemaat yang ditugaskan</td><td>Transaksi dan laporan keuangan</td></tr></tbody></table></div></section>`}
function csvDownload(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportMembers(){csvDownload('sim-jemaat-anggota.csv',[['Nomor Anggota','Nama','Keluarga','Resort','Jemaat','Telepon','Status'],...members.map(m=>[m.id,m.name,m.family,m.resort,m.church,m.phone,m.status])])}
function exportTransactions(){csvDownload('sim-jemaat-keuangan.csv',[['ID','Tanggal','Jenis','Kategori','Jumlah','Jemaat','Catatan'],...transactions.map(t=>[t.id,t.date,t.type,t.category,t.amount,t.church,t.note])])}
function exportEvents(){csvDownload('sim-jemaat-jadwal.csv',[['Tanggal','Kegiatan','Lokasi','Penanggung Jawab'],...events.map(e=>[e.date,e.title,e.place,e.person])])}
function exportAll(){let b=new Blob([JSON.stringify({members,transactions,events,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sim-jemaat-cadangan-demo.json';a.click();URL.revokeObjectURL(a.href)}
function render(){let titles={dashboard:['Dashboard','Ringkasan informasi jemaat'],anggota:['Data Anggota','Direktori dan data keluarga'],keuangan:['Keuangan','Pemasukan, pengeluaran, dan saldo'],pelayanan:['Jadwal Pelayanan','Kalender kegiatan jemaat'],renungan:['Renungan Harian','Bahan renungan dan doa'],laporan:['Laporan & Ekspor','Unduh laporan untuk Excel'],pengaturan:['Organisasi & Pengguna','Struktur sinode, resort, dan jemaat']};document.getElementById('pageTitle').textContent=titles[page][0];document.getElementById('crumb').textContent=titles[page][1];let pages={dashboard,anggota:membersPage,keuangan:financePage,pelayanan:servicePage,renungan:devotionPage,laporan:reportsPage,pengaturan:settingsPage};document.getElementById('view').innerHTML=pages[page]()}
render();
</script>
